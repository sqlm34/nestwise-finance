</style></head><body><aside><div class="brand"><span class="mark">n</span>nestwise</div><div class="sep" data-i="spaces">SPACES</div><button class="nav" onclick="space='family';setPage('overview')" data-i="family">Family</button><button class="nav" onclick="space='personal';setPage('overview')" data-i="personal">Personal</button><button class="nav active" onclick="space='business';setPage('overview')" data-i="business">Aksenov LLC</button><div class="sep" data-i="sections">WORKSPACE</div><div id="nav"></div></aside><main><header class="top"><div class="flex"><b class="mob">nestwise</b><span class="sub" id="crumb">Business / Overview</span></div><div class="flex"><span class="badge" data-i="demo">DESIGN DEMO</span><select id="lang" onchange="setLang(this.value)" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option></select></div></header><div class="wrap"><div class="flex"><div><div class="sub" id="kicker">Financial workspace</div><h1 class="title" id="heading">Overview</h1><div class="sub" id="intro">Complete view of household, business, bank statements and accountant exports.</div></div></div><div class="toolbar"><select id="page-mobile" class="mob navmobile" onchange="setPage(this.value)"></select><select id="period" onchange="render()"><option value="year">2026</option><option value="month">October 2026</option><option value="custom">Custom date range</option></select><button class="btn" onclick="setPage('tax')" data-i="report">Accountant report</button><button class="btn primary" onclick="setPage('bank')" data-i="import">Import statement</button></div><div id="content"></div><footer id="foot">Visual prototype only • No live CRM, bank, OCR, tax or persistent data connection.</footer></div></main>
<script>
const CATEGORIES=[{"id": "tax_00", "en": "Total Gross Income", "ru": "Валовая выручка", "section": "income"}, {"id": "tax_01", "en": "Purchases", "ru": "Закупки", "section": "cogs"}, {"id": "tax_02", "en": "Labor (1099-NEC forms)", "ru": "Работы подрядчиков (1099-NEC)", "section": "cogs"}, {"id": "tax_03", "en": "Other Cost", "ru": "Прочая себестоимость", "section": "cogs"}, {"id": "tax_04", "en": "Accounting Fees", "ru": "Бухгалтерские услуги", "section": "expense"}, {"id": "tax_05", "en": "Advertising", "ru": "Реклама", "section": "expense"}, {"id": "tax_06", "en": "Auto and Truck Expenses", "ru": "Расходы на автомобиль и грузовик", "section": "expense"}, {"id": "tax_07", "en": "Bank Charges", "ru": "Банковские комиссии", "section": "expense"}, {"id": "tax_08", "en": "Business Meal", "ru": "Деловое питание", "section": "expense"}, {"id": "tax_09", "en": "Commissions", "ru": "Комиссионные", "section": "expense"}, {"id": "tax_10", "en": "Computer Expense", "ru": "Компьютерные расходы", "section": "expense"}, {"id": "tax_11", "en": "Delivery and Freight", "ru": "Доставка и перевозки", "section": "expense"}, {"id": "tax_12", "en": "Dues and Subscriptions", "ru": "Членские взносы и подписки", "section": "expense"}, {"id": "tax_13", "en": "Gifts", "ru": "Подарки", "section": "expense"}, {"id": "tax_14", "en": "Insurance", "ru": "Страхование", "section": "expense"}, {"id": "tax_15", "en": "Internet", "ru": "Интернет", "section": "expense"}, {"id": "tax_16", "en": "Janitorial", "ru": "Клининговые услуги", "section": "expense"}, {"id": "tax_17", "en": "Laundry and Cleaning", "ru": "Прачечная и уборка", "section": "expense"}, {"id": "tax_18", "en": "Legal and Professional Fees", "ru": "Юридические и профессиональные услуги", "section": "expense"}, {"id": "tax_19", "en": "Licenses and Permits", "ru": "Лицензии и разрешения", "section": "expense"}, {"id": "tax_20", "en": "Marketing & Promotion", "ru": "Маркетинг и продвижение", "section": "expense"}, {"id": "tax_21", "en": "Miscellaneous", "ru": "Прочие расходы", "section": "expense"}, {"id": "tax_22", "en": "Office Expenses", "ru": "Офисные расходы", "section": "expense"}, {"id": "tax_23", "en": "Officer Compensation", "ru": "Вознаграждение должностных лиц", "section": "expense"}, {"id": "tax_24", "en": "Outside Service", "ru": "Сторонние услуги", "section": "expense"}, {"id": "tax_25", "en": "Parking Fees and Tolls", "ru": "Парковки и платные дороги", "section": "expense"}, {"id": "tax_26", "en": "Postage", "ru": "Почтовые расходы", "section": "expense"}, {"id": "tax_27", "en": "Printing", "ru": "Печать", "section": "expense"}, {"id": "tax_28", "en": "Rent", "ru": "Аренда", "section": "expense"}, {"id": "tax_29", "en": "Repairs and Maintenance", "ru": "Ремонт и обслуживание", "section": "expense"}, {"id": "tax_30", "en": "Salaries and Wages", "ru": "Заработная плата", "section": "expense"}, {"id": "tax_31", "en": "Sales Expense", "ru": "Расходы на продажи", "section": "expense"}, {"id": "tax_32", "en": "Security", "ru": "Охрана", "section": "expense"}, {"id": "tax_33", "en": "Supplies", "ru": "Расходные материалы", "section": "expense"}, {"id": "tax_34", "en": "Taxes", "ru": "Налоги", "section": "expense"}, {"id": "tax_35", "en": "Telephone", "ru": "Телефонная связь", "section": "expense"}, {"id": "tax_36", "en": "Temporary Help", "ru": "Временные сотрудники", "section": "expense"}, {"id": "tax_37", "en": "Tools", "ru": "Инструменты", "section": "expense"}, {"id": "tax_38", "en": "Trade Show Expense", "ru": "Выставочные расходы", "section": "expense"}, {"id": "tax_39", "en": "Training and Seminars", "ru": "Обучение и семинары", "section": "expense"}, {"id": "tax_40", "en": "Travel", "ru": "Командировки", "section": "expense"}, {"id": "tax_41", "en": "Uniforms", "ru": "Униформа", "section": "expense"}, {"id": "tax_42", "en": "Utilities", "ru": "Коммунальные услуги", "section": "expense"}, {"id": "tax_43", "en": "Website", "ru": "Веб-сайт", "section": "expense"}];
const labels={en:{spaces:'SPACES',sections:'WORKSPACE',family:'Family',personal:'Personal',business:'Aksenov LLC',demo:'DESIGN DEMO',report:'Accountant report',import:'Import statement',overview:'Overview',transactions:'Transactions',crm:'CRM Integration',refunds:'Refunds & Adjustments',expenses:'Business Expenses',bank:'Bank Statements',reconcile:'Reconciliation',mapping:'Tax Categories',tax:'Tax Center / PDF',settings:'Language & Settings',period:'Reporting period',gross:'Customer revenue',cost:'CRM parts costs',other:'Other expenses',net:'Illustrative operating result',owner:'Owner transfers',records:'Records',source:'Source',amount:'Amount',status:'Status',date:'Date',match:'Match state',unmatched:'Needs review',matched:'Matched',pending:'Pending review',total:'Total',heading:'Finance that stays in sync',statement:'Accountant statement — original line names',exceptions:'Open exceptions',draft:'Draft — not yet accountant approved',add:'Add expense',revert:'Reset demo',download:'Download CSV',print:'Print report / Save PDF',review:'Mark reviewed (demo)',upload:'Upload PDF or CSV',hint:'Receipt and bank imports must be reviewed. This demo does not read files.',enforced:'Do not double count CRM revenue, expenses and bank evidence.',local:'Display language',months:'Year / month filters',noData:'No items'},ru:{spaces:'ПРОСТРАНСТВА',sections:'РАЗДЕЛЫ',family:'Семья',personal:'Личные финансы',business:'Aksenov LLC',demo:'ДЕМО-ДИЗАЙН',report:'Отчет бухгалтеру',import:'Загрузить выписку',overview:'Обзор',transactions:'Операции',crm:'CRM-интеграция',refunds:'Возвраты и корректировки',expenses:'Бизнес-расходы',bank:'Банковские выписки',reconcile:'Сверка операций',mapping:'Налоговые категории',tax:'Налоговый центр / PDF',settings:'Язык и настройки',period:'Отчетный период',gross:'Выручка от клиентов',cost:'Запчасти из CRM',other:'Прочие расходы',net:'Примерный операционный результат',owner:'Переводы владельцу',records:'Операции',source:'Источник',amount:'Сумма',status:'Статус',date:'Дата',match:'Результат сверки',unmatched:'Требует проверки',matched:'Совпадение',pending:'На проверке',total:'Итого',heading:'Единая финансовая система',statement:'Отчет бухгалтеру — исходные английские названия строк',exceptions:'Неразобранные операции',draft:'Черновик — бухгалтер не подтвердил',add:'Добавить расход',revert:'Сбросить демо',download:'Скачать CSV',print:'Печать отчета / PDF',review:'Подтвердить (демо)',upload:'Выбрать PDF или CSV',hint:'Чеки и выписки требуют проверки. Демо не читает файлы.',enforced:'Не учитывайте повторно доходы и затраты из CRM по банковским выпискам.',local:'Язык интерфейса',months:'Фильтры по месяцу / году',noData:'Нет данных'}};
let lang=localStorage.getItem('nestwise-lang')||'en',page='overview',space='business',statementUploaded=false,verified=false;const t=k=>labels[lang][k]||k;const money=n=>new Intl.NumberFormat(lang==='ru'?'ru-RU':'en-US',{style:'currency',currency:'USD'}).format(n);const demoRows=[['CRM #125','crm',350,'customer payment'],['CRM #125','crm',-95,'parts cost'],['CRM #125','crm',-350,'customer refund'],['Chase statement','bank',-45,'fuel'],['South National','bank',-88,'internet'],['Nestwise receipt','receipt',-25,'tools'],['CRM #126','crm',275,'customer payment'],['CRM #126','crm',-60,'parts cost']];let extra=[{name:'Fuel',category:'Auto and Truck Expenses',amount:45},{name:'Internet',category:'Internet',amount:88},{name:'Tools',category:'Tools',amount:25}];let matched=[true,true,true,true,false,true,true,true];
const pages=['overview','transactions','crm','refunds','expenses','bank','reconcile','mapping','tax','settings'];function nav(){document.getElementById('nav').innerHTML=pages.map(k=>`<button class="nav ${page===k?'active':''}" onclick="setPage('${k}')">${t(k)}</button>`).join('');document.getElementById('page-mobile').innerHTML=pages.map(k=>`<option value="${k}" ${k===page?'selected':''}>${t(k)}</option>`).join('')}
const metric=(label,value,note)=>`<div class="card"><div class="sub">${label}</div><div class="metric">${money(value)}</div><div class="caption">${note||'2026 • Demo'}</div></div>`;
const table=(heads,rows)=>`<div class="table-wrap"><table class="table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i===r.length-1?'num':''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function overview(){return `<div class="warning" style="margin-top:20px">${t('enforced')}</div><div class="grid">${metric(t('gross'),625)}${metric(t('cost'),155)}${metric(t('other'),extra.reduce((s,e)=>s+e.amount,0))}${metric(t('net'),625-350-155-extra.reduce((s,e)=>s+e.amount,0),'Includes $350 customer refund')}</div><div class="cols"><div class="card"><div class="flex"><h3>${t('transactions')}</h3><span class="badge">CRM → Nestwise</span></div>${table([t('source'),t('amount')],demoRows.slice(0,5).map(r=>[r[0]+' · '+r[3],money(r[2])]))}</div><div class="card"><h3>${t('heading')}</h3>${[['1','CRM: finalized payments + corrections'],['2','Bank: statement import and match'],['3','OCR: review expense and map category'],['4','Accountant: approve and export PDF']].map(x=>`<div class="step"><b>${x[0]}</b><div>${x[1]}</div></div>`).join('')}</div></div>`}
function transactions(){return `<div class="card" style="margin-top:20px"><h3>${t('records')} · sample</h3>${table([t('source'),t('status'),t('amount')],demoRows.map((r,i)=>[r[0]+' · '+r[3],matched[i]?t('matched'):t('unmatched'),money(r[2])]))}</div>`}
function crm(){return `<div class="grid">${metric('CRM orders',2)}${metric('CRM receipts',625)}${metric('Customer refunds',350)}${metric('Parts & job costs',155)}</div><div class="card"><h3>Alex Appliance Repair CRM · ${t('status')}</h3><div class="flex"><div>● <b class="good">Design specification</b><div class="sub">No live API connected. Planned: transactional outbox → Queue → signed Nestwise events.</div></div><span class="badge">READY FOR CODEX</span></div><div class="section">Event stream</div>${table(['Event','Order','Revision','Financial impact'],[['job.financials_finalized','#125','1','+$350 / −$95'],['job.customer_refund_issued','#125','2','−$350'],['job.financials_finalized','#126','1','+$275 / −$60']])}</div>`}
function refunds(){return `<div class="grid">${metric('Original sale',350)}${metric('Part cost',95)}${metric('Customer refund',350)}${metric('Job contribution after refund',-95)}</div><div class="card"><h3>${t('refunds')} — Order #125</h3><div class="warning">A refund is a new reversing financial event; never delete the original sale. Supplier credit, if later received, is a separate adjustment.</div>${table(['Event','Source','Amount'],[['Customer payment','CRM','+$350'],['Parts spent','CRM','−$95'],['Customer refund','CRM','−$350']])}</div>`}
function expenses(){return `<div class="card" style="margin-top:20px"><div class="flex"><h3>${t('expenses')}</h3><button class="btn primary" onclick="addExpense()">+ ${t('add')}</button></div>${table(['Expense','Tax statement category',t('amount')],extra.map(e=>[e.name,e.category,money(e.amount)]))}<div class="warning" style="margin-top:20px">CRM-linked parts costs belong to CRM imports. Do not re-enter them here.</div></div>`}
function bank(){return `<div class="grid">${metric('Chase · sample statement',1,'Imported file')} ${metric('South National · sample statement',1,'Imported file')} ${metric('Rows needing review',matched.filter(v=>!v).length)}${metric('Statement periods',2,'Demonstration')}</div><div class="card"><h3>${t('bank')}</h3><div class="formrow"><select id="bankname"><option>Chase Business</option><option>South National Business</option></select><input type="file" id="file" accept=".pdf,.csv,.ofx,.qfx,image/*" onchange="statementUploaded=!!this.files.length;document.getElementById('filemsg').textContent=statementUploaded?'File selected for future import workflow; no actual parsing in demo.':''"></div><p class="sub" id="filemsg">${t('hint')}</p><div class="section">Import workflow</div>${[['01','Upload bank statement PDF / CSV'],['02','Extract bank rows with confidence and provenance'],['03','Match CRM settlement batches and expenses'],['04','Review duplicates, transfers, unmatched lines'],['05','Approve posting and reconcile ending balance']].map(x=>`<div class="step"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div>`}
function reconcile(){return `<div class="grid">${metric(t('matched'),matched.filter(Boolean).length,'Demo rows')}${metric(t('unmatched'),matched.filter(v=>!v).length,'Demo rows')}${metric('Statement coverage',2,'Chase + South National')}${metric('Exceptions',matched.filter(v=>!v).length,'Review before final PDF')}</div><div class="card"><h3>${t('reconcile')}</h3>${table([t('source'),t('amount'),t('match')],demoRows.map((r,i)=>[r[0]+' · '+r[3],money(r[2]),matched[i]?`<span class="badge">${t('matched')}</span>`:`<button class="btn" onclick="matched[${i}]=true;render()">${t('review')}</button>`]))}</div>`}
function mapping(){return `<div class="card" style="margin-top:20px"><div class="flex"><h3>${t('mapping')} · ${CATEGORIES.length} exact accountant lines</h3><span class="badge warn">Accountant sign-off needed</span></div>${table(['Stable ID','Exact form label','Meaning in '+(lang==='ru'?'Russian':'English'),'Group'],CATEGORIES.map(c=>[c.id,c.en,lang==='ru'?c.ru:c.en,c.section]))}</div>`}
function tax(){let sum={};extra.forEach(e=>sum[e.category]=(sum[e.category]||0)+e.amount);sum['Total Gross Income']=275;sum['Purchases']=155;return `<div class="print-only"><h1>Financial Statement — 2026</h1><p>Company: Aksenov LLC | Demonstration data — NOT FOR FILING</p></div><div class="warning" style="margin-top:20px">${t('draft')} · 1 ${t('exceptions')} · ${t('enforced')}</div><div class="grid">${metric('Gross receipts before refunds',625)}${metric('Customer refunds',350)}${metric('Gross income (demo net-of-refund)',275)}${metric('Cost of goods (demo)',155)}</div><div class="card"><div class="flex"><div><h3>${t('statement')}</h3><div class="sub">Matches the supplied accountant worksheet labels, not IRS forms.</div></div><div class="formrow"><button class="btn" onclick="downloadCSV()">${t('download')}</button><button class="btn primary" onclick="window.print()">${t('print')}</button></div></div><div class="taxgrid">${CATEGORIES.map(c=>`<div class="taxline"><span>${c.en}<small class="tag"> ${lang==='ru'?(' · '+c.ru):''}</small></span><span>${sum[c.en]!==undefined?money(sum[c.en]):'—'}</span></div>`).join('')}</div><p class="caption">Illustrative numbers only; sign-off required for COGS vs expense, cash/accrual, LLC tax election and account reconciliation.</p></div>`}
function settings(){return `<div class="card" style="margin-top:20px"><h3>${t('local')}</h3><div class="sub">Each user may choose English or Russian independently. Shared amounts and stable category IDs do not change.</div><div class="toolbar"><button class="btn" onclick="setLang('en')">English</button><button class="btn" onclick="setLang('ru')">Русский</button></div><div class="section">Account isolation</div><p class="sub">Family, Personal Alex, Personal Irina and Aksenov LLC. Accountant may receive time-limited read-only exports. Business banking files and tax records must be server-protected.</p></div>`}
function addExpense(){let n=prompt(lang==='ru'?'Название расхода':'Expense description');if(!n)return;let a=Number(prompt(lang==='ru'?'Сумма USD':'Amount USD'));if(!Number.isFinite(a)||a<=0)return alert('Invalid amount');let typ=prompt('Exact form category: Internet, Telephone, Website, Supplies, Tools, etc.', 'Internet');let cat=CATEGORIES.find(c=>c.en.toLowerCase()===String(typ).toLowerCase() && c.section==='expense');if(!cat)return alert('Category not in accountant form');extra.push({name:n,category:cat.en,amount:Math.round(a*100)/100});setPage('expenses')}
function downloadCSV(){let rows=[['Form line','Amount USD'],...CATEGORIES.map(c=>[c.en,extra.filter(x=>x.category===c.en).reduce((s,x)=>s+x.amount,0)])];rows[1][1]=275;rows[2][1]=155;let a=document.createElement('a'),b=new Blob([rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv'});a.href=URL.createObjectURL(b);a.download='nestwise-demo-accountant-statement.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function setLang(v){lang=v;localStorage.setItem('nestwise-lang',v);render()}function setPage(v){page=v;render()}function render(){document.documentElement.lang=lang;document.getElementById('lang').value=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));nav();document.getElementById('crumb').textContent=t('business')+' / '+t(page);document.getElementById('heading').textContent=t(page);document.getElementById('intro').textContent=t('heading');document.getElementById('content').innerHTML=({overview,transactions,crm,refunds,expenses,bank,reconcile,mapping,tax,settings})[page]();document.getElementById('foot').textContent=lang==='ru'?'Демонстрационный прототип. Реального подключения к CRM, банкам, OCR и налоговым системам нет.':'Visual prototype only. No live CRM, bank, OCR, tax or persistent data connection.'}render();
</script></body></html>
