name: CI
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nestwise_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d nestwise_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@localhost:5432/nestwise_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Back up and restore isolated PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres -d nestwise_test -Fc -f /tmp/nestwise.dump
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres nestwise_restore
          docker exec "$POSTGRES_CONTAINER" pg_restore -U postgres -d nestwise_restore --no-owner /tmp/nestwise.dump
          node scripts/verify-restore.cjs
      - run: npm run build:web
      - run: npm run build:mobile
      - run: npm run worker:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-preview
          path: dist
          retention-days: 7
  staging:
    needs: checks
    if: github.event_name == 'push' && vars.STAGING_ENABLED == 'true'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Deploy isolated staging Worker
        run: npm run worker:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed staging health
        run: |
          node --input-type=module -e '
            const response = await fetch("https://nestwise-staging.alexeasyrepair.workers.dev/health");
            const health = await response.json();
            if (!response.ok || health.service !== "nestwise" ||
                health.environment !== "staging" || health.financialIngestion !== false) {
              throw new Error("Unexpected staging health response");
            }
            console.log("Staging health verified; financial ingestion disabled.");
          '
  eas-access:
    needs: checks
    if: github.event_name == 'push' && vars.EAS_ENABLED == 'true'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify CI identity can access the linked Expo project
        run: npx --no-install eas project:info
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          APP_ENV: staging
