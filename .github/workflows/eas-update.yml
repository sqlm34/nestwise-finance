name: Publish compatible Android update
on:
  workflow_dispatch:
    inputs:
      target:
        description: Update channel (production is an explicit release)
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ota-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.EAS_ENABLED == 'true'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: ${{ inputs.target }}
      EXPO_PUBLIC_API_URL: ${{ inputs.target == 'production' && 'https://nestwise.universestitch.com' || 'https://nestwise-staging.alexeasyrepair.workers.dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require successful exact main CI
        run: node scripts/verify-ci-candidate.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: node scripts/release-preflight.cjs
      - run: node scripts/dependency-audit.cjs
      - name: Export and verify the update before upload
        run: |
          npm run build:mobile -- --source-maps
          node scripts/verify-mobile-bundle.cjs
      - name: Publish Android update to the selected channel
        run: npx --yes eas-cli@25.2.0 update --channel "$UPDATE_CHANNEL" --environment "$EAS_ENVIRONMENT" --platform android --input-dir dist-mobile --skip-bundler --message "Verified main $GITHUB_SHA" --non-interactive
        env:
          UPDATE_CHANNEL: ${{ inputs.target }}
          EAS_ENVIRONMENT: ${{ inputs.target == 'production' && 'production' || 'preview' }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
